[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv

lib_deps =
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^7.0.4
    arduino-libraries/NTPClient@^3.2.1
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git

build_flags =
    -D CORE_DEBUG_LEVEL=3

; Notes:
; - upload_speed is set to 921600 for fast flashing; if you experience upload errors, reduce to 115200.
; - board_build.partitions uses min_spiffs.csv (keeps SPIFFS small). If you need more filesystem space, change to a partition table with larger spiffs.
; - platform locked to espressif32@6.5.0 for reproducible builds. Update if you intentionally want newer platform versions and verify compatibility with libraries.
